# VoiceHubPay — TS 全栈 K8s 部署清单（Rancher asia-k3s / ns idoknow）
#
# 形态：单镜像双角色
#   - voicehubpay-server : API + 静态 web（镜像默认 CMD）
#   - voicehubpay-worker : 后台调度（过期订单取消 + 卡密释放 + reservations）
#
# 数据：沿用 PHP 时代 hostPath（/opt/k8s-idoknow/panel/www），APP_BASE_PATH 指向
# 旧站点目录以复用 storage/.masterkey（卡密密文解密必须同一把 key）。
# SHOP_LEGACY_ENABLED=1 + 不设 DATABASE_URL → SQLite 落在旧库文件上，
# migrateShopSchema 幂等建缺失表（现有 voicehubpay.sqlite 结构兼容）。
#
# 切流：把 ingress 后端从 service voicehubpay(8080) 改为 voicehubpay-ts:8080。
---
apiVersion: v1
kind: Service
metadata:
  name: voicehubpay-ts
  namespace: idoknow
  labels: {app: voicehubpay-ts}
spec:
  selector: {app: voicehubpay-ts}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicehubpay-ts
  namespace: idoknow
  labels: {app: voicehubpay-ts}
spec:
  replicas: 1
  strategy: {type: Recreate}   # SQLite 单文件,禁双写
  selector:
    matchLabels: {app: voicehubpay-ts}
  template:
    metadata:
      labels: {app: voicehubpay-ts}
    spec:
      nodeSelector: {kubernetes.io/hostname: cn-sh-tencent-01}
      tolerations:
        - {effect: NoSchedule, operator: Exists}
      containers:
        - name: server
          image: ghcr.io/fhzit/voicehubpay:refactor-typescript-fullstack-migration
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env:
            - {name: SHOP_LEGACY_ENABLED, value: "1"}
            - {name: APP_BASE_PATH, value: /legacy/vhpay/index}
            - {name: DATABASE_PATH, value: /legacy/vhpay/index/storage/voicehubpay.sqlite}
            - {name: APP_URL, value: https://vhpay.idoknow.top}
            - {name: ORDER_TTL_MINUTES, value: "30"}
            - name: SG65_PID
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: SG65_PID}}
            - name: SG65_MERCHANT_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: SG65_MERCHANT_PRIVATE_KEY}}
            - name: SG65_PLATFORM_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: SG65_PLATFORM_PUBLIC_KEY}}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: legacy-www, mountPath: /legacy/vhpay}
        - name: worker
          image: ghcr.io/fhzit/voicehubpay:refactor-typescript-fullstack-migration
          imagePullPolicy: Always
          command: ["npx", "tsx", "apps/worker/src/entrypoint.ts"]
          args: ["--interval-ms=60000"]
          env:
            - {name: SHOP_LEGACY_ENABLED, value: "1"}
            - {name: APP_BASE_PATH, value: /legacy/vhpay/index}
            - {name: DATABASE_PATH, value: /legacy/vhpay/index/storage/voicehubpay.sqlite}
            - {name: ORDER_TTL_MINUTES, value: "30"}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: legacy-www, mountPath: /legacy/vhpay, readOnly: true}
      volumes:
        - name: legacy-www
          hostPath:
            path: /opt/k8s-idoknow/panel/www
            type: Directory
---
# SG65 密钥 + 应用配置。先填值再 apply（见 README 步骤）。
apiVersion: v1
kind: Secret
metadata:
  name: voicehubpay-ts-env
  namespace: idoknow
type: Opaque
stringData:
  SG65_PID: ""
  SG65_MERCHANT_PRIVATE_KEY: ""
  SG65_PLATFORM_PUBLIC_KEY: ""
