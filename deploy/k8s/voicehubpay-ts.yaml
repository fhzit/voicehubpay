# VoiceHubPay — TS 全栈 K8s 部署清单（Rancher asia-k3s / ns idoknow）
#
# 形态：单镜像双容器（server + worker），数据库用集群现有 PostgreSQL
# （deploy voicehub-postgres，库 voicehubpay —— 已含完整 legacy schema 与
# 生产数据：products/orders/order_items/inventory_cards/payment_transactions/users 等）。
#
# TS 侧 DATABASE_URL 直连该库；首次启动 migrateAuthSchema/migrateShopSchema
# 幂等补齐缺失表（如 sessions）。masterkey 仍从 PHP 时代站点目录只读挂载读取
# （storage/.masterkey，卡密解密必须同一把 key）。
#
# 切流：把 ingress 后端从 service voicehubpay(8080) 改为 voicehubpay-ts:8080。
---
apiVersion: v1
kind: Service
metadata:
  name: voicehubpay-ts
  namespace: idoknow
  labels: {app: voicehubpay-ts}
spec:
  selector: {app: voicehubpay-ts}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicehubpay-ts
  namespace: idoknow
  labels: {app: voicehubpay-ts}
spec:
  replicas: 1
  selector:
    matchLabels: {app: voicehubpay-ts}
  template:
    metadata:
      labels: {app: voicehubpay-ts}
    spec:
      nodeSelector: {kubernetes.io/hostname: cn-sh-tencent-01}
      tolerations:
        - {effect: NoSchedule, operator: Exists}
      containers:
        - name: server
          image: ghcr.io/fhzit/voicehubpay:refactor-typescript-fullstack-migration
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env:
            - {name: SHOP_LEGACY_ENABLED, value: "1"}
            - {name: APP_BASE_PATH, value: /legacy/vhpay/index}
            - {name: APP_URL, value: https://vhpay.idoknow.top}
            - {name: ORDER_TTL_MINUTES, value: "30"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: DATABASE_URL}}
            - name: SG65_PID
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: SG65_PID}}
            - name: SG65_MERCHANT_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: SG65_MERCHANT_PRIVATE_KEY}}
            - name: SG65_PLATFORM_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: SG65_PLATFORM_PUBLIC_KEY}}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: legacy-www, mountPath: /legacy/vhpay, readOnly: true}
        - name: worker
          image: ghcr.io/fhzit/voicehubpay:refactor-typescript-fullstack-migration
          imagePullPolicy: Always
          command: ["npx", "tsx", "apps/worker/src/entrypoint.ts"]
          args: ["--interval-ms=60000"]
          env:
            - {name: SHOP_LEGACY_ENABLED, value: "1"}
            - {name: APP_BASE_PATH, value: /legacy/vhpay/index}
            - {name: ORDER_TTL_MINUTES, value: "30"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: voicehubpay-ts-env, key: DATABASE_URL}}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: legacy-www, mountPath: /legacy/vhpay, readOnly: true}
      volumes:
        - name: legacy-www
          hostPath:
            path: /opt/k8s-idoknow/panel/www
            type: Directory
---
# DATABASE_URL + SG65 密钥。先填值再 apply（见 README 步骤）。
apiVersion: v1
kind: Secret
metadata:
  name: voicehubpay-ts-env
  namespace: idoknow
type: Opaque
stringData:
  # postgres://<user>:<password>@voicehub-postgres.idoknow.svc:5432/voicehubpay
  DATABASE_URL: ""
  SG65_PID: ""
  SG65_MERCHANT_PRIVATE_KEY: ""
  SG65_PLATFORM_PUBLIC_KEY: ""
