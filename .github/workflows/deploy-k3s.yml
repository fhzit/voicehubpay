name: Deploy VoiceHubPay (k3s)

# 推送 deploy/prod 即发布：构建镜像 → 固定 digest → patch Deployment voicehubpay-ts
# → 等 rollout → 断言集群里跑的确实是这个 digest。
# 发版前把 main 快进到要上线的提交，再把 deploy/prod 快进到同一个提交。
on:
  push:
    branches: [deploy/prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: voicehubpay-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: fhzit/voicehubpay
  PULL_REGISTRY: ghcr.nju.edu.cn

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production (k3s)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/deploy/prod'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is canonical main
        run: |
          git fetch origin main deploy/prod
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/deploy/prod)" = "$GITHUB_SHA"

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.4

      - name: Deploy exact digest and verify
        env:
          KUBECONFIG_DATA: ${{ secrets.VOICEHUBPAY_KUBECONFIG }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          PULL_REGISTRY: ghcr.nju.edu.cn
        run: bash scripts/deploy-k3s.sh
